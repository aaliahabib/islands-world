# Render blueprint for the Islands World server.
#
# Only the server lives here. The static site (shell + island bundles) is built
# by GitHub Actions and published to GitHub Pages — see .github/workflows/deploy.yml.
#
# After the first deploy, copy the service URL and set it as the SERVER_URL
# repository variable in GitHub (Settings → Secrets and variables → Actions →
# Variables) as: wss://<service>.onrender.com/ws

services:
  - type: web
    name: islands-world-server
    runtime: node
    plan: starter # always-on; the free plan sleeps and drops the scoreboard mid-class
    rootDir: core/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    # Only redeploy when the server actually changes, so students pushing
    # islands never bounce the server during a session.
    buildFilter:
      paths:
        - core/server/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: islands-world-db
          property: connectionString

databases:
  - name: islands-world-db
    plan: free
    databaseName: islands_world
